<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2Z GARMENT - Latest Collection</title>
    
    <!-- Firebase CDN (Compat Versions) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            color: #333; 
            padding-bottom: 70px;
            background-attachment: fixed;
        }
        
        header { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            color: white; 
            text-align: center; 
            padding: 20px 15px; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        header h1 { font-size: 28px; color: #ffcc00; letter-spacing: 2px; }
        header p { font-size: 13px; opacity: 0.95; margin-top: 5px; }
        
        .shop-info { 
            background: rgba(255, 255, 255, 0.95); 
            margin: 15px; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 14px; 
            text-align: center; 
            border-left: 4px solid #ffcc00; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .admin-panel { 
            background: rgba(255, 255, 255, 0.98); 
            margin: 15px; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); 
        }
        .admin-panel h3 { 
            margin-bottom: 10px; 
            color: #2c5364; 
            font-size: 16px; 
            border-bottom: 2px solid #ffcc00; 
            display: inline-block; 
        }
        .form-group { margin-bottom: 10px; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 14px;
        }
        .btn-add { 
            background: linear-gradient(135deg, #27ae60, #229954); 
            color: white; 
            border: none; 
            padding: 12px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 15px; 
        }
        .btn-add:disabled { background: #95a5a6; cursor: not-allowed; }

        .categories { 
            display: flex; 
            overflow-x: auto; 
            padding: 5px 15px; 
            gap: 8px; 
            margin-bottom: 10px; 
        }
        .cat-btn { 
            background: rgba(255, 255, 255, 0.9); 
            border: 2px solid transparent;
            padding: 8px 16px; 
            border-radius: 20px; 
            white-space: nowrap; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 13px; 
        }
        .cat-btn.active { 
            background: linear-gradient(135deg, #203a43, #2c5364); 
            color: white;
            border-color: #ffcc00;
        }

        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 12px; 
            padding: 0 15px; 
        }
        .product-card { 
            background: rgba(255, 255, 255, 0.98); 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            position: relative;
        }
        .product-card img { width: 100%; height: 180px; object-fit: cover; }
        .product-details { padding: 10px; }
        .product-title { font-size: 14px; font-weight: bold; color: #222; margin-bottom: 5px; }
        .product-price { color: #e67e22; font-weight: bold; font-size: 15px; }
        .btn-order { 
            display: block; 
            width: 100%; 
            background: linear-gradient(135deg, #25D366, #1fa856); 
            color: white; 
            text-align: center; 
            padding: 8px 0; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 6px; 
            margin-top: 8px; 
            font-size: 13px; 
        }
        .btn-delete { 
            position: absolute; 
            top: 5px; 
            right: 5px; 
            background: rgba(255, 50, 50, 0.95); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 28px; 
            height: 28px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 18px; 
        }

        .floating-contacts { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: rgba(255, 255, 255, 0.98); 
            display: flex; 
            justify-content: space-around; 
            padding: 8px 10px; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15); 
            z-index: 1000;
        }
        .action-btn { 
            flex: 1; 
            margin: 0 5px; 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center; 
            text-decoration: none; 
            color: white; 
            font-weight: bold; 
            font-size: 13px; 
        }
        .btn-call { background: linear-gradient(135deg, #007bff, #0056b3); }
        .btn-wa { background: linear-gradient(135deg, #25D366, #1fa856); }
        .btn-location { background: linear-gradient(135deg, #dc3545, #bb2d3b); }

        .message { 
            padding: 12px; 
            margin: 10px 15px; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: bold; 
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; display: block; border: 2px solid #28a745; }
        .message.error { background: #f8d7da; color: #721c24; display: block; border: 2px solid #dc3545; }
    </style>
</head>
<body>

    <header>
        <h1>A2Z GARMENT</h1>
        <p>Not just fashion, it's a feeling!</p>
    </header>

    <div class="shop-info">
        <strong>Pro.: Samar Khan</strong> | 📍 Malhani Bazar, Aflepur<br>
        📞 <strong>Mobile:</strong> 8400602425
    </div>

    <!-- Admin Section -->
    <div class="admin-panel">
        <h3>+ Add New Stock (Admin)</h3>
        <div id="messageBox" class="message"></div>
        <div class="form-group">
            <input type="text" id="prodName" placeholder="Item Name (e.g. Denim Shirt)">
        </div>
        <div class="form-group">
            <input type="text" id="prodPrice" placeholder="Price (e.g. ₹499)">
        </div>
        <div class="form-group">
            <select id="prodCategory">
                <option value="Pants">Pants</option>
                <option value="Shirts">Shirts</option>
                <option value="T-Shirts">T-Shirts</option>
                <option value="Lowers">Lowers</option>
                <option value="Mom Fit">Mom Fit</option>
                <option value="Straight Fit">Straight Fit</option>
            </select>
        </div>
        <div class="form-group">
            <input type="file" id="prodImage" accept="image/*">
        </div>
        <button class="btn-add" id="uploadBtn" onclick="addProduct()">Upload Item</button>
    </div>

    <!-- Category Filter -->
    <div class="categories">
        <button class="cat-btn active" data-category="all" onclick="filterCategory(event)">All</button>
        <button class="cat-btn" data-category="Pants" onclick="filterCategory(event)">Pants</button>
        <button class="cat-btn" data-category="Shirts" onclick="filterCategory(event)">Shirts</button>
        <button class="cat-btn" data-category="T-Shirts" onclick="filterCategory(event)">T-Shirts</button>
        <button class="cat-btn" data-category="Lowers" onclick="filterCategory(event)">Lowers</button>
    </div>

    <div class="product-grid" id="productGrid"></div>

    <div class="floating-contacts">
        <a href="tel:8400602425" class="action-btn btn-call">📞 Call</a>
        <a href="https://wa.me/918400602425?text=Hello,%20I%20want%20to%20inquire%20about%20A2Z%20Garment%20products." class="action-btn btn-wa">💬 WhatsApp</a>
        <a href="https://maps.google.com/?q=Malhani+Bazar+Aflepur" target="_blank" class="action-btn btn-location">📍 Location</a>
    </div>

    <script>
        // Tumhare Project ki Real Firebase Keys[span_1](start_span)[span_1](end_span)
        const firebaseConfig = {
            authDomain: "a2z-collection.firebaseapp.com",
            projectId: "a2z-collection",
            storageBucket: "a2z-collection.appspot.com",
            messagingSenderId: "153903317291",
            appId: "1:153903317291:web:b262f55928646bcf3a1e16"
        };

        // Complete Firebase Initialization
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const PHONE = "918400602425";
        let products = [];
        let currentFilter = 'all';

        function init() {
            // Firestore Live Realtime Sync
            db.collection("products").orderBy("addedAt", "desc").onSnapshot((snapshot) => {
                products = [];
                snapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                renderProducts();
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        function showMessage(text, type = 'success') {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
            setTimeout(() => { messageBox.className = 'message'; }, 3000);
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            const filtered = currentFilter === 'all' 
                ? products 
                : products.filter(p => p.category === currentFilter);

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 20px; color: #fff; font-weight: 500;">No products available in this category.</p>';
                return;
            }

            filtered.forEach((p) => {
                const waMessage = `Hello A2Z Garment, I want to order this item:\n*Name:* ${p.name}\n*Price:* ${p.price}`;
                const waLink = `https://wa.me/${PHONE}?text=${encodeURIComponent(waMessage)}`;

                grid.innerHTML += `
                    <div class="product-card">
                        <button class="btn-delete" onclick="deleteProduct('${p.id}')" title="Delete product">×</button>
                        <img src="${p.image}" alt="${p.name}">
                        <div class="product-details">
                            <div class="product-title">${escapeHTML(p.name)}</div>
                            <div class="product-price">${escapeHTML(p.price)}</div>
                            <a href="${waLink}" target="_blank" class="btn-order">Order via WhatsApp</a>
                        </div>
                    </div>
                `;
            });
        }

        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addProduct() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const category = document.getElementById('prodCategory').value;
            const imgInput = document.getElementById('prodImage');
            const btn = document.getElementById('uploadBtn');

            if (!name || !price || imgInput.files.length === 0) {
                showMessage('Please fill all fields and select an image!', 'error');
                return;
            }

            const file = imgInput.files[0];
            btn.disabled = true;
            btn.textContent = 'Uploading...';

            const reader = new FileReader();
            reader.onload = function(e) {
                db.collection("products").add({
                    name: name,
                    price: price,
                    category: category,
                    image: e.target.result,
                    addedAt: new Date().toISOString()
                }).then(() => {
                    showMessage('Product added live for everyone! ✓', 'success');
                    document.getElementById('prodName').value = '';
                    document.getElementById('prodPrice').value = '';
                    imgInput.value = '';
                }).catch((err) => {
                    showMessage('Error adding product to cloud!', 'error');
                    console.error(err);
                }).finally(() => {
                    btn.disabled = false;
                    btn.textContent = 'Upload Item';
                });
            };
            reader.readAsDataURL(file);
        }

        function deleteProduct(docId) {
            if (confirm("Delete this product for everyone?")) {
                db.collection("products").doc(docId).delete().then(() => {
                    showMessage('Product deleted! ✓', 'success');
                });
            }
        }

        function filterCategory(event) {
            event.preventDefault();
            const category = event.target.getAttribute('data-category');
            if (!category) return;
            currentFilter = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts();
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
